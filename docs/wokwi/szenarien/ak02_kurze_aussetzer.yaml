# AK-2: 1 oder 2 Fehlschlaege in Folge loesen KEINEN Ausfall aus (Lauf mit --fail-text FEHLER)
# Gehoert zu REQ-001. Erklaerung: docs/wokwi/szenarien/README.md
# Kabel = Taster in der SDA-Leitung (pressed 1 = Kabel dran, 0 = Kabel ab). Pin 9 = Motor.
name: "ak02_kurze_aussetzer"
version: 1
steps:
  # --- Vorspann (5150 ms): beide Kabel dran, Arm gestreckt, Taste = Einmessen ---
  - set-control: {part-id: kabel1, control: pressed, value: 1}
  - set-control: {part-id: kabel2, control: pressed, value: 1}
  - delay: 1000ms
  - set-control: {part-id: taste, control: pressed, value: 1}
  - delay: 150ms
  - set-control: {part-id: taste, control: pressed, value: 0}
  - delay: 4000ms
  # --- Ende Vorspann ---
  # IMU 2: dreimal kurz weg (30 ms = 1 bis 2 Messungen bei 50 Hz)
  - set-control: {part-id: kabel2, control: pressed, value: 0}
  - delay: 30ms
  - set-control: {part-id: kabel2, control: pressed, value: 1}
  - delay: 500ms
  - expect-pin: {part-id: uno, pin: "9", value: 0}
  - set-control: {part-id: kabel2, control: pressed, value: 0}
  - delay: 30ms
  - set-control: {part-id: kabel2, control: pressed, value: 1}
  - delay: 500ms
  - expect-pin: {part-id: uno, pin: "9", value: 0}
  - set-control: {part-id: kabel2, control: pressed, value: 0}
  - delay: 30ms
  - set-control: {part-id: kabel2, control: pressed, value: 1}
  - delay: 500ms
  - expect-pin: {part-id: uno, pin: "9", value: 0}
  # IMU 1: auch kurz weg
  - set-control: {part-id: kabel1, control: pressed, value: 0}
  - delay: 30ms
  - set-control: {part-id: kabel1, control: pressed, value: 1}
  - delay: 500ms
  - expect-pin: {part-id: uno, pin: "9", value: 0}
  # Beide gleichzeitig kurz weg
  - set-control: {part-id: kabel1, control: pressed, value: 0}
  - set-control: {part-id: kabel2, control: pressed, value: 0}
  - delay: 30ms
  - set-control: {part-id: kabel1, control: pressed, value: 1}
  - set-control: {part-id: kabel2, control: pressed, value: 1}
  - delay: 1000ms
  - expect-pin: {part-id: uno, pin: "9", value: 0}
